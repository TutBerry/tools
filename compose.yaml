x-app: &app
  build: .
  environment:
    DJANGO_SECRET_KEY: local-development-only-not-for-production
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    DATABASE_URL: postgresql://tutberry:tutberry@db:5432/tutberry
    LOG_LEVEL: info
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1}
    BROKER_URL: amqp://tutberry:tutberry@broker:5672/
    CACHE_URL: redis://cache:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
services:
  api:
    stop_grace_period: 40s
    <<: *app
    ports: ["8080:8080"]
    command: sh -c "python manage.py migrate --noinput && gunicorn tutberry.wsgi:application --bind 0.0.0.0:8080 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
  worker:
    stop_grace_period: 40s
    <<: *app
    command: ["python", "-m", "tutberry.workers.notifier"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      broker:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutberry
      POSTGRES_PASSWORD: tutberry
      POSTGRES_DB: tutberry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutberry -d tutberry"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
  broker:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tutberry
      RABBITMQ_DEFAULT_PASS: tutberry
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["brokerdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  cache:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: ["cachedata:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.18
    ports: ["127.0.0.1:8025:8025"]
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
  jaeger:
    image: jaegertracing/all-in-one:1.58
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
volumes:
  promdata:
  pgdata:
  brokerdata:
  cachedata:
