name: CI

on:
  push:
    branches: [main, lab05-quality, lab-06]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutberry
          POSTGRES_PASSWORD: tutberry
          POSTGRES_DB: tutberry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutberry -d tutberry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: github-actions-ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://tutberry:tutberry@localhost:5432/tutberry
      COVERAGE_FILE: /tmp/.coverage
      CACHE_URL: redis://127.0.0.1:1/0
      BROKER_URL: amqp://guest:guest@127.0.0.1:1/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit installed Python dependencies
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --strict

      - name: Scan Git history for secrets
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 detect \
            --source=/repo --redact --exit-code=1

      - name: Verify Must requirement traceability
        run: python scripts/check_traceability.py

      - name: Ruff lint
        run: python -m ruff check tutberry tests --no-cache --exclude tutberry/migrations --ignore EXE002,RUF012

      - name: Mypy type checking
        run: python -m mypy tutberry --ignore-missing-imports --no-incremental --cache-dir=/tmp/mypy_cache --exclude 'migrations/'

      - name: Run tests with coverage
        run: timeout --signal=TERM --kill-after=5s 60s python -m pytest tests/ --cov=tutberry --cov-branch --cov-report=term-missing --cov-fail-under=70 -p no:cacheprovider -p no:randomly

      - name: Detect five deliberate behavior mutations
        run: python scripts/mutation_smoke.py

      - name: Repeat test suite five times to detect flaky failures
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::Repeat $attempt/5"
            timeout --signal=TERM --kill-after=5s 60s python -m pytest tests/ -q -p no:cacheprovider -p no:randomly
            echo "::endgroup::"
          done

      - name: Check test order independence with pytest-randomly
        run: timeout --signal=TERM --kill-after=5s 60s python -m pytest tests/ -q -p no:cacheprovider -p randomly --randomly-seed=20261121

  async-integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: github-actions-ci-only-secret
      DATABASE_URL: postgresql://tutberry:tutberry@localhost:5432/tutberry
      TEST_BROKER_URL: amqp://guest:guest@127.0.0.1:5672/
      TEST_CACHE_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Check domain dependency boundaries
        run: |
          if grep -REn '^[[:space:]]*(from|import)[[:space:]]+(pika|aio_pika|redis)([[:space:].]|$)' tutberry/domain tutberry/services; then
            exit 1
          fi
      - name: Integration tests
        run: python -m pytest tests/test_broker_integration.py tests/test_valkey_integration.py tests/test_event_idempotency.py -q -p no:randomly
